workflows:
  ios-fix:
    name: "iOS Build with Auto Fix"
    
    environment:
      flutter: "3.40.0-0.2.pre"
    
    scripts:
      - name: "检查并修复 iOS 项目"
        script: |
          echo "=== 检查项目结构 ==="
          ls -la
          
          # 如果缺少 ios 目录
          if [ ! -d "ios" ]; then
            echo "创建 iOS 目录..."
            flutter create --platforms=ios --org com.example --project-name app_sux .
          fi
          
          # 进入 ios 目录检查
          cd ios
          
          # 如果缺少 Podfile
          if [ ! -f "Podfile" ]; then
            echo "生成 Podfile..."
            pod init
            
            # 使用简单的 Podfile 内容
            echo '# Uncomment this line to define a global platform for your project' > Podfile
            echo '# platform :ios, "12.0"' >> Podfile
            echo '' >> Podfile
            echo '# CocoaPods analytics sends network stats synchronously affecting flutter build latency.' >> Podfile
            echo "ENV['COCOAPODS_DISABLE_STATS'] = 'true'" >> Podfile
            echo '' >> Podfile
            echo "project 'Runner', {" >> Podfile
            echo "  'Debug' => :debug," >> Podfile
            echo "  'Profile' => :release," >> Podfile
            echo "  'Release' => :release," >> Podfile
            echo '}' >> Podfile
            echo '' >> Podfile
            echo 'target "Runner" do' >> Podfile
            echo '  use_frameworks!' >> Podfile
            echo '  use_modular_headers!' >> Podfile
            echo '' >> Podfile
            echo '  # Flutter Pods' >> Podfile
            echo '  pod "Flutter", :path => "../.symlinks/flutter/ios-release"' >> Podfile
            echo 'end' >> Podfile
            
            echo "Podfile 创建完成"
          fi
          
          ls -la
      
      - name: "安装依赖"
        script: |
          echo "安装 Flutter 依赖..."
          flutter pub get
          
          echo "安装 iOS 依赖..."
          cd ios
          pod install --repo-update
      
      - name: "构建应用"
        script: |
          flutter build ios --release --no-codesign
      
      - name: "打包"
        script: |
          cd ios
          xcode-project use-profiles
          xcode-project build-ipa --workspace "Runner.xcworkspace" --scheme "Runner"
    
    artifacts:
      - build/ios/ipa/*.ipa