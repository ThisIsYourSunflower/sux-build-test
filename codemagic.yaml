workflows:
  ios-release:
    name: "iOS Release"
    
    environment:
      flutter: "3.40.0-0.2.pre"
    
    scripts:
      - name: "安装依赖"
        script: |
          flutter clean
          flutter pub get
          cd ios && pod install
      
      - name: "iOS 自动签名"
        script: |
          cd ios
          # 关键：让 Codemagic 自动处理签名
          xcode-project use-profiles
      
      - name: "构建并打包"
        script: |
          flutter build ios --release --no-codesign
          cd ios
          xcode-project build-ipa --workspace "Runner.xcworkspace" --scheme "Runner"
    
    artifacts:
      - build/ios/ipa/*.ipa